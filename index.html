<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>برای شبنم ♥</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Playpen+Sans+Arabic:wght@400;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;min-height:100%;overflow-x:hidden}
body{
  font-family:'Vazirmatn',sans-serif;
  background:
    radial-gradient(circle at 15% 15%,rgba(255,190,210,.35),transparent 30%),
    radial-gradient(circle at 85% 80%,rgba(190,160,255,.22),transparent 32%),
    linear-gradient(145deg,#180b20,#30102c 45%,#12091a);
  color:#fff; min-height:100vh;
}
#app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;position:relative;overflow:hidden}
.glow{position:fixed;width:240px;height:240px;border-radius:50%;filter:blur(80px);opacity:.28;pointer-events:none}
.g1{background:#ff4f91;top:-80px;right:-70px}.g2{background:#8d5cff;bottom:-90px;left:-70px}

.card{
  width:min(520px,100%); position:relative; z-index:5;
  padding:34px 24px 28px; border:1px solid rgba(255,255,255,.15);
  border-radius:30px; background:rgba(255,255,255,.075);
  backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
  box-shadow:0 25px 80px rgba(0,0,0,.45), inset 0 1px rgba(255,255,255,.12);
  animation:cardIn .8s ease;
}
@keyframes cardIn{from{opacity:0;transform:translateY(25px) scale(.97)}to{opacity:1;transform:none}}

.badge{display:inline-flex;padding:7px 13px;border-radius:99px;background:rgba(255,125,174,.14);border:1px solid rgba(255,150,190,.2);color:#ffc3da;font-size:12px;margin-bottom:18px}
h1{font-family:'Playpen Sans Arabic','Vazirmatn',sans-serif;font-size:31px;line-height:1.5;margin-bottom:10px}
.subtitle{color:#d9cbd7;line-height:2;font-size:14px;margin-bottom:26px}
.heart{font-size:55px;display:block;margin-bottom:10px;filter:drop-shadow(0 8px 18px rgba(255,70,130,.45));animation:pulse 1.7s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}

.progress{height:5px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden;margin:0 0 25px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff70a5,#c58cff);border-radius:99px;transition:.5s}

.qnum{font-size:12px;color:#d9a9c1;margin-bottom:8px}
.question{font-size:22px;font-weight:800;line-height:1.65;margin-bottom:20px}
.options{display:grid;gap:11px}
.option{
  border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.06);
  color:#fff;border-radius:18px;padding:15px 16px;text-align:right;
  font-family:inherit;font-size:14px;cursor:pointer;transition:.25s;
}
.option:hover{transform:translateY(-2px);background:rgba(255,105,160,.13);border-color:rgba(255,150,190,.35)}
.option.selected{background:linear-gradient(135deg,rgba(255,91,143,.28),rgba(171,112,255,.18));border-color:#ff86ae}
.option.wrong{animation:shake .35s}
@keyframes shake{25%{transform:translateX(6px)}50%{transform:translateX(-6px)}75%{transform:translateX(4px)}}

.next{
  width:100%;margin-top:20px;border:0;border-radius:17px;padding:15px;
  color:#fff;font:700 15px inherit;cursor:pointer;
  background:linear-gradient(135deg,#ff4f91,#9d68ff);
  box-shadow:0 12px 30px rgba(214,73,144,.25);transition:.25s
}
.next:hover{transform:translateY(-2px);filter:brightness(1.08)}
.next:disabled{opacity:.4;cursor:not-allowed;transform:none}

.secret{
  margin-top:17px;padding:18px;border-radius:20px;background:rgba(255,255,255,.055);
  border:1px dashed rgba(255,170,200,.25);line-height:2;color:#ffe6ef;
  font-family:'Playpen Sans Arabic','Vazirmatn',sans-serif;font-size:15px;animation:fade .5s ease
}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.final{text-align:center}
.final h2{font-size:29px;line-height:1.6;margin:10px 0 15px}
.final p{color:#ead9e5;line-height:2.1;font-size:15px}
.big-heart{font-size:75px;animation:float 2.5s ease-in-out infinite;display:block}
@keyframes float{50%{transform:translateY(-10px)}}

.petals{position:fixed;inset:0;pointer-events:none;z-index:20;overflow:hidden}
.petal{position:absolute;top:-40px;font-size:20px;animation:fall linear forwards;filter:drop-shadow(0 3px 6px rgba(0,0,0,.2))}
@keyframes fall{
  0%{transform:translate3d(0,-50px,0) rotate(0deg);opacity:0}
  10%{opacity:1}
  100%{transform:translate3d(var(--x),110vh,0) rotate(720deg);opacity:.9}
}
.spark{position:fixed;pointer-events:none;z-index:19;font-size:18px;animation:spark 1.1s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:translate(var(--sx),var(--sy)) scale(1.4)}}

.footer{margin-top:20px;color:#9f879d;font-size:11px;text-align:center}
@media(max-width:420px){
  .card{padding:28px 18px 22px;border-radius:25px}
  h1{font-size:27px}.question{font-size:20px}
}
</style>
</head>
<body>
<div class="glow g1"></div><div class="glow g2"></div>
<div id="app">
  <div class="card" id="card"></div>
</div>
<div class="petals" id="petals"></div>

<script>
const questions = [
  {
    q:"شبنم، چقدر از من خوشت میاد؟ 😌",
    opts:["یه کم... شاید 😏","خیلی زیاد 🥹♥️","در حدی که خودمم نمی‌دونم 😭","این سؤال اصلاً قابل اندازه‌گیری نیست! 😂"],
    secret:"من که از همون اول می‌دونستم جواب درستش باید «خیلی زیاد» باشه... ولی دوست داشتم خودت بگی. ♥️"
  },
  {
    q:"میدونی چقدر دوستت دارم؟",
    opts:["آره، ولی می‌خوام دوباره بگی 🥹","نه، لطفاً بهم بگو ♥️","فکر کنم خیلی زیاد...","شاید هنوز نمی‌دونی چقدر!"],
    secret:"فکر می‌کردم به اندازه‌ی همه‌ی شن‌های کویر دوستت دارم،<br>بعد فهمیدم کویر هم از عشق من به تو کم میاره. 🏜️♥️<br><br>حالا فهمیدی چرا جوابش رو نمی‌شه با عدد گفت؟"
  },
  {
    q:"اگه یه روز خیلی خسته باشی، دوست داری من چیکار کنم؟ 🌙",
    opts:["فقط کنارم باشی","یه عالمه حرف قشنگ بزنی","بخندونیم همدیگه رو","همه‌شون با هم ♥️"],
    secret:"پس قرارمون اینه: روزای سخت هم تنها نمی‌مونی؛ یه نفر هست که دلش می‌خواد لبخندت رو برگردونه. 🌷"
  },
  {
    q:"اگه بخوام یه اسم برای تو انتخاب کنم، کدوم قشنگ‌تره؟",
    opts:["شبنمِ من 🌸","خانومِ خاص من ✨","دلیل لبخند من 🥹","همه‌شون، چون تو یکی بیشتر از یه اسمی"],
    secret:"البته اسم واقعی تو «شبنم»ـه؛ ولی توی قلب من یه اسم دیگه داری: «آدمِ دوست‌داشتنیِ من». ♥️"
  }
];

let step=0, selected=-1;
const card=document.getElementById('card');

function renderStart(){
  card.innerHTML=`
    <div style="text-align:center">
      <span class="heart">♥</span>
      <span class="badge">یه چیز کوچیک برای شبنم</span>
      <h1>چند تا سؤال دارم<br>خانومِ خاص 🌷</h1>
      <p class="subtitle">فقط جواب بده؛ آخرش یه چیز کوچیک منتظرتـه...<br>و لطفاً با دقت جواب بده، چون من حواسم هست 😌</p>
      <button class="next" onclick="start()">بزن بریم ♥</button>
      <div class="footer">ساخته شده با کلی فکر و یه ذره عشق :)</div>
    </div>`;
}
function start(){step=0;selected=-1;renderQuestion()}
function renderQuestion(){
  const x=questions[step]; selected=-1;
  card.innerHTML=`
    <div class="qnum">سؤال ${step+1} از ${questions.length}</div>
    <div class="progress"><i style="width:${(step/questions.length)*100}%"></i></div>
    <div class="question">${x.q}</div>
    <div class="options">${x.opts.map((o,i)=>`<button class="option" onclick="choose(${i},this)">${o}</button>`).join('')}</div>
    <button class="next" id="nextBtn" disabled onclick="nextQuestion()">ادامه ♥</button>`;
}
function choose(i,el){
  selected=i;
  document.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('nextBtn').disabled=false;
}
function nextQuestion(){
  if(selected<0)return;
  if(step===1 && selected===1){
    showSecret(questions[step].secret);
    return;
  }
  if(step<questions.length-1){step++;renderQuestion()}
  else showFinal();
}
function showSecret(text){
  card.innerHTML=`
    <div class="qnum">یه جواب مخصوص تو ♥</div>
    <div class="secret">${text}</div>
    <button class="next" onclick="step++;renderQuestion()">ادامه‌ی ماجرا ✨</button>`;
}
function showFinal(){
  card.innerHTML=`
    <div class="final">
      <span class="big-heart">♥</span>
      <span class="badge">پایان سؤال‌ها</span>
      <h2>شبنم جان،<br>یه چیزو یادت نره... 🌷</h2>
      <p>بین تمام آدم‌های دنیا،<br>بعضی‌ها فقط «آدم» نیستن؛<br>یه تیکه از آرامش آدم می‌شن.</p>
      <p style="margin-top:16px;color:#ffc5da;font-weight:700">و تو برای من یکی از همونایی. ♥</p>
      <button class="next" onclick="celebrate()">این دکمه رو بزن 🌸</button>
    </div>`;
}
function celebrate(){
  for(let i=0;i<70;i++) setTimeout(makePetal,i*35);
  for(let i=0;i<25;i++) setTimeout(makeSpark,i*45);
  card.innerHTML=`
    <div class="final">
      <span class="big-heart">💗</span>
      <h2>این همه گل برای توئه، شبنم 🌸</h2>
      <p>چون بعضی آدم‌ها رو نمی‌شه فقط با چند جمله توضیح داد؛<br>باید براشون یه عالمه گل ریخت. 🌷</p>
      <button class="next" onclick="location.reload()">از اول ببینیم؟ ♥</button>
    </div>`;
}
function makePetal(){
  const p=document.createElement('div');p.className='petal';
  p.textContent=['🌸','🌷','🌹','💮','🌺','♥️'][Math.floor(Math.random()*6)];
  p.style.left=Math.random()*100+'vw';
  p.style.setProperty('--x',(Math.random()*240-120)+'px');
  p.style.animationDuration=(3+Math.random()*4)+'s';
  p.style.fontSize=(14+Math.random()*18)+'px';
  document.getElementById('petals').appendChild(p);
  setTimeout(()=>p.remove(),8000);
}
function makeSpark(){
  const s=document.createElement('div');s.className='spark';s.textContent='✨';
  s.style.left=(35+Math.random()*30)+'vw';s.style.top=(35+Math.random()*30)+'vh';
  s.style.setProperty('--sx',(Math.random()*260-130)+'px');
  s.style.setProperty('--sy',(Math.random()*260-130)+'px');
  document.body.appendChild(s);setTimeout(()=>s.remove(),1200);
}
renderStart();
</script>

<script>
/* ===== Cloudflare analytics config =====
   بعد از Deploy کردن Worker، آدرس آن را اینجا بگذار.
*/
const ANALYTICS_CONFIG = {
  workerUrl: "https://shanbam-api.salhamir146.workers.dev",
  enabled: true
};

let analyticsSession = null;
let analyticsConsent = false;

function getSessionId(){
  let id = localStorage.getItem("shanbam_session_id");
  if(!id){
    id = crypto.randomUUID ? crypto.randomUUID() :
      Date.now().toString(36)+"-"+Math.random().toString(36).slice(2);
    localStorage.setItem("shanbam_session_id", id);
  }
  return id;
}

async function track(event, data={}){
  if(!ANALYTICS_CONFIG.enabled || !analyticsConsent) return;
  try{
    await fetch(ANALYTICS_CONFIG.workerUrl + "/api/event", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        sessionId:getSessionId(),
        event,
        data,
        page:"love-quiz"
      }),
      keepalive:true
    });
  }catch(e){
    console.debug("Analytics unavailable");
  }
}

function showNote(){
  const box=document.createElement("div");
  box.innerHTML=`
    <div style="position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;
      background:rgba(25,12,29,.92);border:1px solid rgba(255,170,200,.25);
      border-radius:16px;padding:11px 14px;color:#eadbe7;font-size:12px;line-height:1.9;
      font-family:Vazirmatn,sans-serif;text-align:center;transition:opacity .8s">
     💗
    </div>`;
  document.body.appendChild(box);
  setTimeout(()=>{box.firstElementChild.style.opacity="0";},4500);
  setTimeout(()=>box.remove(),5500);
}

analyticsConsent = true;
track("page_view",{});
if(!localStorage.getItem("shanbam_note_seen")){
  localStorage.setItem("shanbam_note_seen","yes");
  setTimeout(showNote,400);
}

/* Wrap the existing answer functions so selected answers are recorded. */
const originalChoose = choose;
choose = function(i,el){
  originalChoose(i,el);
  track("answer",{
    question: step+1,
    questionText: questions[step].q,
    option: i+1,
    optionText: questions[step].opts[i]
  });
};

const originalCelebrate = celebrate;
celebrate = function(){
  track("completed",{totalQuestions:questions.length});
  originalCelebrate();
};
</script>

</body>
</html>
